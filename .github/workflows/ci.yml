name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: android-cleaner/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust core tests
        working-directory: android-cleaner/core
        run: cargo test

      - name: Install frontend dependencies
        working-directory: android-cleaner
        run: npm ci

      - name: Frontend tests
        working-directory: android-cleaner
        run: npm test

      - name: Frontend build
        working-directory: android-cleaner
        run: npm run build
